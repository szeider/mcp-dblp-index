name: Build monthly dblp index

on:
  schedule:
    # The dump of the 1st appears on DROPS between the 2nd and the 6th (2026: May 4,
    # Jun 2, Jul 6, Aug 3, Sep 2 at 11:48 UTC). Runs before that, or after the month's
    # release is published, end after the first step.
    - cron: "17 6,14 2-12 * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Dump release date (YYYY-MM-01); default = first of the current month"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Pick release
        id: rel
        run: |
          REL="${{ github.event.inputs.release }}"
          [ -n "$REL" ] || REL="$(date -u +%Y-%m)-01"
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          if gh release view "dblp-$REL" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "release dblp-$REL already published"
            exit 0
          fi
          # the month's dump, whatever its day (Oct 2026: dblp-2026-10-03.xml.gz)
          if SRC=$(scripts/find_dump.sh "$REL"); then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "dump for $REL: $SRC"
          elif [ "${{ github.event_name }}" = schedule ] && [ "$(date -u +%-d)" -le 12 ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "dump $REL not on DROPS yet; next run retries"
          else
            echo "::error::no dump for $REL on DROPS (scripts/find_dump.sh)"; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: steps.rel.outputs.build == 'true'
        with:
          python-version: "3.12"

      - name: Install tools
        if: steps.rel.outputs.build == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zstd sqlite3
          pip install -q "mcp-dblp==${{ vars.MCP_DBLP_VERSION || '2.0.0' }}"
          mcp-dblp-index --help >/dev/null

      - name: Build release
        if: steps.rel.outputs.build == 'true'
        run: scripts/build_release.sh "${{ steps.rel.outputs.release }}" "${{ runner.temp }}/out"

      - name: Publish release
        if: steps.rel.outputs.build == 'true'
        run: |
          REL="${{ steps.rel.outputs.release }}"
          cd "${{ runner.temp }}/out"
          PUBS=$(python3 -c "import json;print(json.load(open('latest.json'))['publications'])")
          gh release create "dblp-$REL" --latest --title "dblp index $REL" \
            --notes "Prebuilt SQLite index of the dblp XML dump of $(date -d "$REL" +'%B %Y') ($(cat SOURCE) on Dagstuhl DROPS, $PUBS publications). Data: CC0, https://dblp.org. Built by mcp-dblp-index-builder; see latest.json for checksums." \
            "dblp-$REL.sqlite.zst" latest.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keepalive commit
        if: steps.rel.outputs.build == 'true'
        run: |
          echo "${{ steps.rel.outputs.release }}" > LAST_RELEASE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LAST_RELEASE && git commit -m "Release dblp-${{ steps.rel.outputs.release }}" && git push

      - name: Open issue on failure
        if: failure()
        run: |
          # one issue per release: later failed runs comment on it
          TITLE="Index build failed for ${{ steps.rel.outputs.release || 'unknown release' }}"
          BODY="See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq "map(select(.title == \"$TITLE\"))[0].number // empty")
          if [ -n "$N" ]; then gh issue comment "$N" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
        env:
          GH_TOKEN: ${{ github.token }}
